<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Diary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="today-screen" class="screen">
        <header class="today-header">
            <h1 id="today-date"></h1>
        </header>

        <section class="color-picker-area">

    <div id="color-preview" class="color-preview"></div>

    <div class="color-picker">

        <div
            id="saturation-brightness"
            class="saturation-brightness"
            role="slider"
            aria-label="Choose saturation and brightness"
            tabindex="0"
        >
            <div id="sb-cursor" class="picker-cursor"></div>
        </div>

        <div
            id="hue-wheel"
            class="hue-wheel"
            role="slider"
            aria-label="Choose hue"
            tabindex="0"
        >
            <div id="hue-cursor" class="picker-cursor"></div>
        </div>

    </div>

</section>

        <button id="save-button" class="save-button" aria-label="Save">
            ✓
        </button>
    </main>

    <main id="diary-screen" class="screen" hidden>
    <header class="diary-header">
        <h1>Diary</h1>
    </header>

    <section class="diary-view">
        <div class="diary-mode-switch">
    <button id="day-mode" class="active">Day</button>
    <button id="week-mode">Week</button>
    <button id="month-mode">Month</button>
</div>
        <div class="diary-navigation">
            <button id="previous-day" aria-label="Previous day">‹</button>
            <h2 id="diary-date"></h2>
            <button id="next-day" aria-label="Next day">›</button>
        </div>

        <div id="diary-color" class="diary-color"></div>

        <div id="week-view" class="week-view" hidden>

    <div class="week-navigation">
        <button id="previous-week" aria-label="Previous week">‹</button>
        <h2 id="week-date"></h2>
        <button id="next-week" aria-label="Next week">›</button>
    </div>

    <div class="week-days">
        <div class="week-day">
            <span>Sun</span>
            <div id="week-sun" class="week-color">・</div>
        </div>

        <div class="week-day">
            <span>Mon</span>
            <div id="week-mon" class="week-color">・</div>
        </div>

        <div class="week-day">
            <span>Tue</span>
            <div id="week-tue" class="week-color">・</div>
        </div>

        <div class="week-day">
            <span>Wed</span>
            <div id="week-wed" class="week-color">・</div>
        </div>

        <div class="week-day">
            <span>Thu</span>
            <div id="week-thu" class="week-color">・</div>
        </div>

        <div class="week-day">
            <span>Fri</span>
            <div id="week-fri" class="week-color">・</div>
        </div>

        <div class="week-day">
            <span>Sat</span>
            <div id="week-sat" class="week-color">・</div>
        </div>
    </div>

</div>

<div id="month-view" class="month-view" hidden>

    <div class="month-navigation">
        <button id="previous-month" aria-label="Previous month">‹</button>
        <h2 id="month-date"></h2>
        <button id="next-month" aria-label="Next month">›</button>
    </div>

    <div class="month-weekdays">
        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
    </div>

    <div id="month-grid" class="month-grid"></div>

</div>

    </section>
    </main>

    <main id="settings-screen" class="screen" hidden>
    <header class="settings-header">
        <h1>Settings</h1>
    </header>

    <section class="settings-content">
        <button id="export-button">Export</button>
        <button id="import-button">Import</button>
    </section>
</main>

    

    <nav class="bottom-nav" aria-label="Main navigation">
        <button data-screen="diary">Diary</button>
        <button data-screen="today" class="active">Today</button>
        <button data-screen="settings">Settings</button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
